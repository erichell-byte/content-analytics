name: TikTok collector checks
on:
  pull_request:
    paths: ['tiktok/**', '.github/workflows/tiktok-checks.yml']
  push:
    paths: ['tiktok/**', '.github/workflows/tiktok-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r tiktok/requirements.lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tiktok/tests -v
